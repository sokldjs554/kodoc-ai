[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kodoc-ai"
version = "0.1.0"
description = "KoDoc — 한국어 문서 이해 RAG 서비스 (VLM 문서 파싱 · 형태소 기반 하이브리드 검색 · vLLM 서빙 최적화)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 한국어 형태소 분석 (BM25 토크나이저). 없으면 정규식 폴백으로 동작한다.
korean = ["kiwipiepy>=0.17"]
# 고품질 임베딩 (BAAI/bge-m3). torch를 끌고 오므로 선택 설치.
embeddings = ["sentence-transformers>=3.0"]
# PDF -> 이미지 렌더링 (VLM 파싱 입력용)
pdf = ["pypdfium2>=4.28", "pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
kodoc = "kodoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
